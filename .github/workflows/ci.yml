name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new push comes in.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-services:
    name: Python — services + handlers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install root requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax-check Python source trees
        run: |
          python -m compileall -q middleware/DataMgmt-Service
          python -m compileall -q middleware/RAGMgmt-Service
          python -m compileall -q middleware/Regulated-Healthcare-DAGS

      - name: Import smoke test — DataMgmt-Service
        working-directory: middleware/DataMgmt-Service
        run: python -c "from main import app; print('datamgmt OK', app.title)"

      - name: Import smoke test — RAGMgmt-Service
        working-directory: middleware/RAGMgmt-Service
        run: python -c "from main import app; print('ragmgmt OK', app.title)"

      - name: Resolve-secret smoke test (literal pass-through)
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'middleware/RAGMgmt-Service')
          from common.secrets import resolve_secret
          assert resolve_secret('plain-value') == 'plain-value'
          assert resolve_secret(None) is None
          assert resolve_secret('') == ''
          print('secrets.py literal pass-through OK')
          "

      - name: Unit tests — RAGMgmt core (corpus types, embedding, chunking, RRF, reranker)
        run: python -m unittest discover -s middleware/RAGMgmt-Service/tests -v

      - name: Unit tests — DAG handlers (HTML extraction)
        run: python -m unittest discover -s middleware/Regulated-Healthcare-DAGS/tests -v

  optional-extras-import:
    name: Optional extras — import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: python-services
    strategy:
      fail-fast: false
      matrix:
        extra: [bedrock-drafter, cross-encoder-rerank, real-embedder, langfuse]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install base requirements + the matrix extra
        working-directory: middleware/RAGMgmt-Service
        run: |
          python -m pip install --upgrade pip
          # Install via pyproject extra so we cover the same dep resolution
          # operators get from `pip install '.[<extra>]'`. The pyproject's
          # `[project.optional-dependencies]` is the single source of truth.
          pip install -e '.[${{ matrix.extra }}]'

      - name: Verify the extra's load-bearing module imports
        working-directory: middleware/RAGMgmt-Service
        env:
          MATRIX_EXTRA: ${{ matrix.extra }}
        run: |
          # Verify the import chain that goes live when the extra is installed.
          # Construction-only — no model downloads, no AWS calls. Catches any
          # regression where a factory's `import X` would fail with the dep
          # actually installed (mocked sys.modules in unit tests can't catch
          # this class of breakage).
          python -c "
          import os, sys
          extra = os.environ['MATRIX_EXTRA']

          if extra == 'bedrock-drafter':
              import boto3  # noqa: F401
              from service.drafters.bedrock_drafter import BedrockDrafter
              # Construct without invoking — we don't have AWS creds in CI.
              d = BedrockDrafter(model_id='anthropic.claude-x', region='us-east-1', max_tokens=10)
              assert d.name == 'bedrock_anthropic_claude_drafter'

          elif extra == 'cross-encoder-rerank':
              import sentence_transformers  # noqa: F401
              from service.rerank.cross_encoder_reranker import CrossEncoderReranker
              # Construct without invoking — model load is lazy.
              r = CrossEncoderReranker(model_name='cross-encoder/ms-marco-MiniLM-L-6-v2', alpha=0.5)
              assert r.name == 'cross_encoder'

          elif extra == 'real-embedder':
              import sentence_transformers  # noqa: F401
              from common.sentence_transformer_embedder import SentenceTransformerEmbedder
              # Construct without invoking — model load is lazy.
              e = SentenceTransformerEmbedder(
                  model_name='sentence-transformers/all-MiniLM-L6-v2',
                  expected_dim=384,
              )
              assert e.name == 'sentence_transformer'
              assert e.dim == 384

          elif extra == 'langfuse':
              import langfuse  # noqa: F401
              from common.langfuse_client import LangfuseClient, _HAS_LANGFUSE
              assert _HAS_LANGFUSE, 'LangfuseClient module did not detect installed SDK'
              # Disabled when no host (matches default behavior in prod env).
              c = LangfuseClient(host=None, public_key=None, secret_key=None)
              assert not c.enabled

          else:
              raise SystemExit(f'unknown extra: {extra}')

          print(f'OK — [{extra}] import chain works end-to-end.')
          "

      - name: Re-run unit tests with the extra installed
        working-directory: middleware/RAGMgmt-Service
        env:
          PYTHONPATH: ${{ github.workspace }}/middleware/RAGMgmt-Service
        run: python -m unittest discover -s tests -v

  angular-portals:
    name: Angular — admin + customer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        portal: [admin, customer]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portals/${{ matrix.portal }}/package-lock.json

      - name: Install
        working-directory: portals/${{ matrix.portal }}
        run: npm ci

      - name: Production build
        working-directory: portals/${{ matrix.portal }}
        run: npm run build -- --configuration=production

  portal-images:
    name: Docker — portal images (admin, customer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        portal: [admin, customer]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: portals/${{ matrix.portal }}
          file: portals/${{ matrix.portal }}/Dockerfile
          push: false
          load: true
          tags: rhc-${{ matrix.portal }}:ci
          cache-from: type=gha,scope=rhc-${{ matrix.portal }}
          cache-to: type=gha,scope=rhc-${{ matrix.portal }},mode=max

      - name: Inspect image — non-root user, exposed port
        run: |
          docker image inspect rhc-${{ matrix.portal }}:ci \
            --format 'user={{ "{{.Config.User}}" }} ports={{ "{{.Config.ExposedPorts}}" }}'

  docker-images:
    name: Docker — service images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: DataMgmt-Service
            image_name: rhc-datamgmt
          - service: RAGMgmt-Service
            image_name: rhc-ragmgmt
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push) — SECRETS_PROVIDER=none
        uses: docker/build-push-action@v6
        with:
          context: .
          file: middleware/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ${{ matrix.image_name }}:ci
          build-args: |
            SECRETS_PROVIDER=none
          cache-from: type=gha,scope=${{ matrix.image_name }}-none
          cache-to: type=gha,scope=${{ matrix.image_name }}-none,mode=max

      - name: Build (no push) — SECRETS_PROVIDER=aws
        uses: docker/build-push-action@v6
        with:
          context: .
          file: middleware/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ${{ matrix.image_name }}:ci-aws
          build-args: |
            SECRETS_PROVIDER=aws
          cache-from: type=gha,scope=${{ matrix.image_name }}-aws
          cache-to: type=gha,scope=${{ matrix.image_name }}-aws,mode=max

      - name: Inspect resulting image — non-root user, exposed port
        run: |
          docker image inspect ${{ matrix.image_name }}:ci \
            --format 'user={{ "{{.Config.User}}" }} ports={{ "{{.Config.ExposedPorts}}" }}'

  sql-migrations:
    name: SQL — migration parse check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rhc_admin
          POSTGRES_PASSWORD: rhc_local_dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rhc_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap databases
        env:
          PGPASSWORD: rhc_local_dev
        run: |
          psql -h localhost -U rhc_admin -d postgres -v ON_ERROR_STOP=1 \
            -f DevOps/Local/Postgres/init/01_create_databases.sql

      - name: Run migrations via the project's runner
        env:
          PG_CONTAINER: ""   # not used in CI; we point psql straight at the service
        run: |
          # The runner uses `docker exec` against rhc-postgres; in CI we run psql
          # directly. Recreate the runner's shape with a small inline loop.
          set -euo pipefail
          export PGPASSWORD=rhc_local_dev
          for db in rag_app rag_vectors; do
            echo "==> Migrating $db"
            psql -h localhost -U rhc_admin -d "$db" -v ON_ERROR_STOP=1 -c \
              "CREATE TABLE IF NOT EXISTS _schema_migrations (
                 filename TEXT PRIMARY KEY,
                 checksum TEXT NOT NULL,
                 applied_dt TIMESTAMPTZ NOT NULL DEFAULT NOW()
               );"
            for f in $(find middleware -path "*/migrations/$db/V*.sql" -type f | sort); do
              echo "  applying $f"
              psql -h localhost -U rhc_admin -d "$db" -v ON_ERROR_STOP=1 -f "$f"
            done
          done
