# GCP Secret Manager → k8s Secret for RAGMgmt-Service. See
# externalsecret-datamgmt.example.yaml for the operator/Workload-Identity prereqs.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ragmgmt-secrets
  namespace: rhc-rag
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: ragmgmt-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: rhc-rag-ragmgmt-db-password
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: rhc-rag-ragmgmt-anthropic-api-key
