# Per-Service GCE BackendConfigs: tell the GCE Ingress how to health-check each
# upstream. The FastAPI services expose /health; the SPAs expose /healthz.
#
# To take effect, each Service needs `cloud.google.com/backend-config: '{...}'`
# in its annotations. Patch the base Services in this overlay if you want
# kustomize to wire it automatically — for clarity it's documented here.

apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: rhc-rag-fastapi
  namespace: rhc-rag
spec:
  healthCheck:
    type: HTTP
    requestPath: /health
    port: 80           # the Service port (FastAPI Services listen on 8001/8002 internally
                       # but their Service.spec.ports.port is what BackendConfig sees)
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
  timeoutSec: 60
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: rhc-rag-portals
  namespace: rhc-rag
spec:
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 80
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
  timeoutSec: 60
