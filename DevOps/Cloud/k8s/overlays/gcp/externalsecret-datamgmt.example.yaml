# GCP Secret Manager → k8s Secret via external-secrets.io.
#
# Prereqs:
#   * external-secrets.io operator installed.
#   * Workload Identity bound to a GSA with `roles/secretmanager.secretAccessor`
#     for the project's secrets.
#   * Secrets created in GCP Secret Manager:
#       - rhc-rag-datamgmt-db-password
#       - rhc-rag-datamgmt-airflow-password

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: datamgmt-secrets
  namespace: rhc-rag
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: datamgmt-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: rhc-rag-datamgmt-db-password
    - secretKey: AIRFLOW_PASSWORD
      remoteRef:
        key: rhc-rag-datamgmt-airflow-password
