# AWS ALB Ingress Controller annotations. Replace the certificate-arn and host
# placeholders before applying. Requires the AWS Load Balancer Controller
# installed in the cluster (https://kubernetes-sigs.github.io/aws-load-balancer-controller/).

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rhc-rag
  namespace: rhc-rag
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    # Replace with your ACM cert covering admin.<your-domain> and app.<your-domain>:
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/REPLACE
spec:
  ingressClassName: alb
