# Pulls DataMgmt-Service credentials from AWS Secrets Manager into the
# `datamgmt-secrets` Secret the base Deployment already references.
#
# Prereqs:
#   * external-secrets.io operator installed (https://external-secrets.io/).
#   * IRSA role attached to the operator's ServiceAccount with permission to
#     read the secrets named below.
#   * Secrets created in AWS Secrets Manager:
#       - rhc-rag/datamgmt/db-password
#       - rhc-rag/datamgmt/airflow-password
#
# Replace `clusterSecretStoreName` if you use a SecretStore scoped to this
# namespace instead of cluster-wide.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: datamgmt-secrets
  namespace: rhc-rag
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager     # ClusterSecretStore name in your cluster
    kind: ClusterSecretStore
  target:
    name: datamgmt-secrets        # Matches the Secret in base/datamgmt-secret.example.yaml
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: rhc-rag/datamgmt/db-password
    - secretKey: AIRFLOW_PASSWORD
      remoteRef:
        key: rhc-rag/datamgmt/airflow-password
