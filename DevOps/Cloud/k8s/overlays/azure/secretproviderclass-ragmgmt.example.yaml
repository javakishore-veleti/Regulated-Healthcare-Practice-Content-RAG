# Azure Key Vault → k8s Secret for RAGMgmt-Service. See
# secretproviderclass-datamgmt.example.yaml for the AKV CSI prereqs.

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ragmgmt-secrets
  namespace: rhc-rag
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: REPLACE_WITH_WORKLOAD_IDENTITY_CLIENT_ID
    keyvaultName: myvault
    tenantId: REPLACE_WITH_AZURE_TENANT_ID
    objects: |
      array:
        - |
          objectName: rhc-rag-ragmgmt-db-password
          objectType: secret
        - |
          objectName: rhc-rag-ragmgmt-anthropic-api-key
          objectType: secret
  secretObjects:
    - secretName: ragmgmt-secrets
      type: Opaque
      data:
        - objectName: rhc-rag-ragmgmt-db-password
          key: DB_PASSWORD
        - objectName: rhc-rag-ragmgmt-anthropic-api-key
          key: ANTHROPIC_API_KEY
