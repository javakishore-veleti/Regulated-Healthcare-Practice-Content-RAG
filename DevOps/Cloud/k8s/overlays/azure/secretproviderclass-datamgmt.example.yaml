# Azure Key Vault → k8s Secret via the AKV CSI driver.
#
# Prereqs:
#   * AKV CSI driver installed in the cluster
#     (https://learn.microsoft.com/azure/aks/csi-secrets-store-driver).
#   * Pod has Azure Workload Identity bound to a UAMI that can GET the secrets
#     listed below from the named vault.
#   * Replace `myvault` and `tenantId` with your values; the secrets must
#     already exist in the vault under the names below.
#
# `secretObjects` projects the fetched values into a k8s Secret named
# `datamgmt-secrets` so the existing Deployment's secretKeyRef just works.

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: datamgmt-secrets
  namespace: rhc-rag
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: REPLACE_WITH_WORKLOAD_IDENTITY_CLIENT_ID
    keyvaultName: myvault
    tenantId: REPLACE_WITH_AZURE_TENANT_ID
    objects: |
      array:
        - |
          objectName: rhc-rag-datamgmt-db-password
          objectType: secret
        - |
          objectName: rhc-rag-datamgmt-airflow-password
          objectType: secret
  secretObjects:
    - secretName: datamgmt-secrets
      type: Opaque
      data:
        - objectName: rhc-rag-datamgmt-db-password
          key: DB_PASSWORD
        - objectName: rhc-rag-datamgmt-airflow-password
          key: AIRFLOW_PASSWORD
