apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-portal
  namespace: rhc-rag
  labels:
    app.kubernetes.io/name: customer-portal
    app.kubernetes.io/part-of: regulated-healthcare-rag
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-portal
        app.kubernetes.io/part-of: regulated-healthcare-rag
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: rhc-customer:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: customer-portal
  namespace: rhc-rag
  labels:
    app.kubernetes.io/name: customer-portal
    app.kubernetes.io/part-of: regulated-healthcare-rag
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: customer-portal
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
