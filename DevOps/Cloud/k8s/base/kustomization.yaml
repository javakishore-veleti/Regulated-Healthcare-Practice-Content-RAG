apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rhc-rag

commonLabels:
  app.kubernetes.io/part-of: regulated-healthcare-rag

resources:
  - namespace.yaml
  - datamgmt-configmap.yaml
  - datamgmt-secret.example.yaml
  - datamgmt-deployment.yaml
  - datamgmt-service.yaml
  - ragmgmt-configmap.yaml
  - ragmgmt-secret.example.yaml
  - ragmgmt-deployment.yaml
  - ragmgmt-service.yaml
  - ingress.yaml

# Image refs are placeholders; overlays edit them per environment, e.g.:
#   kustomize edit set image rhc-datamgmt=registry.example.com/rhc-datamgmt:v1.2.3
#   kustomize edit set image rhc-ragmgmt=registry.example.com/rhc-ragmgmt:v1.2.3
images:
  - name: rhc-datamgmt
    newTag: dev
  - name: rhc-ragmgmt
    newTag: dev
