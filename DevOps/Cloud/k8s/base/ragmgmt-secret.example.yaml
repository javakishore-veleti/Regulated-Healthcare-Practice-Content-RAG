# Example Secret for RAGMgmt-Service. See datamgmt-secret.example.yaml for the
# secret-manager-integration patterns; same options apply here.
apiVersion: v1
kind: Secret
metadata:
  name: ragmgmt-secrets
  namespace: rhc-rag
  labels:
    app.kubernetes.io/name: ragmgmt-service
    app.kubernetes.io/part-of: regulated-healthcare-rag
type: Opaque
stringData:
  DB_PASSWORD: "PLACEHOLDER_DO_NOT_COMMIT"
  # Either a literal Anthropic API key or one of:
  #   aws-sm://<region>/<secret-name>
  #   azure-kv://<vault>/<secret-name>
  #   gcp-sm://<project>/<secret-name>[/versions/<version>]
  ANTHROPIC_API_KEY: "PLACEHOLDER_DO_NOT_COMMIT"
