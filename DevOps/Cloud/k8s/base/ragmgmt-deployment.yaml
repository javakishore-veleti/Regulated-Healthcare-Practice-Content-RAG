apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragmgmt
  namespace: rhc-rag
  labels:
    app.kubernetes.io/name: ragmgmt-service
    app.kubernetes.io/part-of: regulated-healthcare-rag
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ragmgmt-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ragmgmt-service
        app.kubernetes.io/part-of: regulated-healthcare-rag
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: ragmgmt
          image: rhc-ragmgmt:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ragmgmt-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ragmgmt-secrets
                  key: DB_PASSWORD
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ragmgmt-secrets
                  key: ANTHROPIC_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              # RAGMgmt does more compute (chunking, retrieval, faithfulness)
              # so request a bit more than DataMgmt by default.
              cpu: 300m
              memory: 384Mi
            limits:
              cpu: 1500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
