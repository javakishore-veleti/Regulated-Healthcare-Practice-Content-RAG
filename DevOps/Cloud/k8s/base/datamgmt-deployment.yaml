apiVersion: apps/v1
kind: Deployment
metadata:
  name: datamgmt
  namespace: rhc-rag
  labels:
    app.kubernetes.io/name: datamgmt-service
    app.kubernetes.io/part-of: regulated-healthcare-rag
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: datamgmt-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datamgmt-service
        app.kubernetes.io/part-of: regulated-healthcare-rag
    spec:
      # Pinned to match the Dockerfile's appuser. Cloud overlays may set
      # fsGroup / seccompProfile etc.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: datamgmt
          # Override per environment via kustomize:
          #   kustomize edit set image datamgmt=registry.example.com/rhc-datamgmt:v1.2.3
          image: rhc-datamgmt:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: datamgmt-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datamgmt-secrets
                  key: DB_PASSWORD
            - name: AIRFLOW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datamgmt-secrets
                  key: AIRFLOW_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
