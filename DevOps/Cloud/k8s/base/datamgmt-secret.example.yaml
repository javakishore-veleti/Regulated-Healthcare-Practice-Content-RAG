# Example Secret for DataMgmt-Service. DO NOT commit a real secret manifest —
# this file is an example only. In production, prefer:
#   * AWS:   ExternalSecrets / SecretsStore CSI pointing at AWS Secrets Manager
#   * Azure: AKV CSI driver
#   * GCP:   Secret Manager via Workload Identity
#
# OR set the data values to secret-manager references and let the application's
# `resolve_secret()` (common/secrets.py) fetch the plaintext at startup:
#
#   DB_PASSWORD: "aws-sm://us-east-1/rhc-db-password"
#   AIRFLOW_PASSWORD: "azure-kv://my-vault/rhc-airflow-password"
#
# When using the secret-reference approach, build the image with the matching
# extra: --build-arg SECRETS_PROVIDER=aws|azure|gcp.

apiVersion: v1
kind: Secret
metadata:
  name: datamgmt-secrets
  namespace: rhc-rag
  labels:
    app.kubernetes.io/name: datamgmt-service
    app.kubernetes.io/part-of: regulated-healthcare-rag
type: Opaque
stringData:
  # Either a literal password or a secret-manager reference (see notes above).
  DB_PASSWORD: "PLACEHOLDER_DO_NOT_COMMIT"
  AIRFLOW_PASSWORD: "PLACEHOLDER_DO_NOT_COMMIT"
