services:
  rhc-postgres:
    image: pgvector/pgvector:pg16
    container_name: rhc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rhc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rhc_local_dev}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rhc-postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-rhc_admin} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  rhc-postgres-data:
    name: rhc-postgres-data
