# Customer portal nginx config. Same shape as the admin portal — see comments
# in portals/admin/nginx.conf for the rationale.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api/ {
        return 404;
    }

    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
