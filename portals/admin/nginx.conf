# Admin portal nginx config. Listens on 8080 (non-privileged port for the
# nginx-unprivileged base image). The ingress handles TLS + /api/* routing in
# front of this — nginx here only serves the static SPA bundle and falls
# through to index.html for client-side routes.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No /api/* proxying here — that's the ingress's job in production. If the
    # browser hits /api/* directly, we 404 so it's obvious the ingress isn't
    # routing correctly rather than silently serving the SPA shell.
    location ^~ /api/ {
        return 404;
    }

    # Long-cache fingerprinted static assets (Angular emits hashed filenames).
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA: any other path falls through to index.html for the Angular router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # k8s probe target (separate from the SPA root so probes don't depend on
    # index.html being present).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
