[project]
name = "datamgmt-service"
version = "0.1.0"
description = "Dataset cataloging, endpoint configuration, and ingest orchestration for the Regulated Healthcare RAG stack."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "httpx>=0.27",
]

[tool.uv]
package = false
