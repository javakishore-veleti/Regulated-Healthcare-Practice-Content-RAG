[project]
name = "ragmgmt-service"
version = "0.1.0"
description = "RAG management for the Regulated Healthcare RAG stack: pattern catalog, chunking, embedding, retrieval, generation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Cloud secret managers — installed only on the deploy target's Dockerfile,
# not in local dev. The runtime resolver in `common/secrets.py` raises a clear
# error if a reference is encountered and the matching SDK is missing.
aws-secrets = ["boto3>=1.34"]
azure-secrets = ["azure-identity>=1.15", "azure-keyvault-secrets>=4.7"]
gcp-secrets = ["google-cloud-secret-manager>=2.18"]

# Langfuse observability — README's primary observability commitment.
# Disabled (no-op) when LANGFUSE_HOST is unset OR when this dep is missing,
# so a fresh checkout doesn't need a running Langfuse instance.
langfuse = ["langfuse>=2.0"]

# Bedrock drafter — README's stated production drafter target. Falls back to
# stub when boto3 is missing OR BEDROCK_MODEL_ID is unset, so a fresh local
# checkout works without AWS credentials.
bedrock-drafter = ["boto3>=1.34"]

# Cross-encoder reranker — README's named third stage of Hybrid+Rerank.
# Heavy: pulls torch (~2 GB transitive) + ms-marco-MiniLM model (~90 MB on
# first use). Falls back to token_overlap (pure stdlib) when this extra
# isn't installed, so dev / CI doesn't take the cold-load hit.
cross-encoder-rerank = ["sentence-transformers>=2.2"]

# Real embedder — replaces the SHA-256 hash stub with a learned embedder
# (default sentence-transformers/all-MiniLM-L6-v2, 384-dim, ~80 MB model).
# Falls back to stub when the dep is missing OR RAG_EMBEDDER_MODEL is unset.
# Shares torch with cross-encoder-rerank, so installing both is incremental.
# WARNING: a query embedded with this backend against a stub-embedded corpus
# produces meaningless similarity scores — the DAG-side embed_via_pgvector
# handler needs the same model swap, and the corpus needs re-embedding.
real-embedder = ["sentence-transformers>=2.2"]

# AWS OpenSearch Serverless retrieval backend — RAG_Mastery_Projects.xlsx
# Project A Task 7's named target. Falls back to PostgresRetrievalDao when
# this extra is missing OR AWS_OPENSEARCH_ENDPOINT is unset.
opensearch = ["opensearch-py>=2.4", "boto3>=1.34"]

# AWS Bedrock Guardrails — second-line semantic guardrails on top of the
# regex policy. Reuses boto3 (shared with [bedrock-drafter]). Falls back to
# regex-only when this extra is missing OR AWS_BEDROCK_GUARDRAIL_ID is
# unset. Set RAG_GUARDRAILS_BACKEND=layered for the recommended posture.
bedrock-guardrails = ["boto3>=1.34"]

[tool.uv]
package = false

# Explicit setuptools package list. Without this, setuptools' flat-layout
# auto-discovery sees more than one top-level package directory and bails
# out (`Multiple top-level packages discovered in a flat-layout`). The
# service's runtime packages are listed here; supporting trees stay out:
#   * tests   — only used by the unit suite, not shipped as part of the dist
#   * scripts — operator one-shots (e.g. seed_practice_voice)
#   * migrations — SQL files, no Python package
[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "common*", "dao*", "eval*", "rag_iface*", "service*"]
exclude = ["tests*", "scripts*", "migrations*"]
